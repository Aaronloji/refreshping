<!doctype html>
<meta charset="utf-8">
<style>
  body{font:14px system-ui,sans-serif;width:260px;margin:12px}
  label{display:block;margin-bottom:8px}
  input,select{font:inherit;padding:4px;box-sizing:border-box}
  #val{width:70px}
  #kw{width:100%;margin-top:4px}
  .small{font-size:12px;color:#555}
  button{font:inherit;width:100%;padding:8px;margin-top:6px;cursor:pointer}
  #status{margin-top:8px;color:#555;min-height:1.2em}
</style>
<label>Refresh every
  <input id="val" type="number" min="1" value="30">
  <select id="unit"><option value="1">seconds</option><option value="60">minutes</option></select>
</label>
<label>Alert when text
  <select id="mode"><option value="appears">appears</option><option value="disappears">disappears</option></select>
  <input id="kw" type="text" placeholder="e.g. In stock (optional)">
  <span class="small">Refresh stops when the alert fires.</span>
</label>
<button id="toggle">Start</button>
<div id="status"></div>
<script src="popup.js"></script>
